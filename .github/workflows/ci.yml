name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: medication_doc_verifier
          POSTGRES_PASSWORD: medication_doc_verifier
          POSTGRES_DB: medication_doc_verifier_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medication_doc_verifier" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://medication_doc_verifier:medication_doc_verifier@localhost:5432/medication_doc_verifier_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
        env:
          AZURE_OPENAI_ENDPOINT: https://example.services.ai.azure.com
          AZURE_OPENAI_API_KEY: ci
      - run: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q
        env:
          AZURE_OPENAI_ENDPOINT: https://example.services.ai.azure.com
          AZURE_OPENAI_API_KEY: ci
          JWT_SECRET: ci
          POSTGRES_PASSWORD: ci
          DOMAIN: example.com
